name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Validate (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4", "8.5"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check that ruleset registers correctly
        run: vendor/bin/phpcs --config-show 2>&1 | grep -i "ModernWpcsRuleset" || vendor/bin/phpcs -i 2>&1 | grep -i "ModernWpcsRuleset"

      # Fails on a bad sniff ref or an unknown property in ruleset.xml.
      - name: Check that ruleset loads
        run: vendor/bin/phpcs --standard=ModernWpcsRuleset -e

      - name: Smoke test (clean fixture reports nothing)
        run: vendor/bin/phpcs --standard=ModernWpcsRuleset tests/fixtures/Clean.php

      # Catches fixer conflicts (two sniffs undoing each other). PHPCS 4 phpcbf exit codes are a
      # bitmask: 1 = fixable, 2 = non-fixable remain, 4 = FAILED TO FIX, 16 = process error.
      - name: Smoke test (phpcbf converges and leaves the fixable fixture clean)
        run: |
          tmp="$(mktemp -d)"
          cp tests/fixtures/Fixable.php "$tmp/Fixable.php"
          set +e
          output="$(vendor/bin/phpcbf --standard=ModernWpcsRuleset "$tmp/Fixable.php")"
          code=$?
          set -e
          echo "$output"
          if [ "$code" -ge 4 ] || grep -qF "FAILED TO FIX" <<< "$output"; then
            echo "::error::phpcbf did not converge (exit code $code)"
            exit 1
          fi
          vendor/bin/phpcs --standard=ModernWpcsRuleset "$tmp/Fixable.php"

      - name: Smoke test (dirty fixture reports expected sniffs)
        run: |
          set +e
          output="$(vendor/bin/phpcs -s --report=emacs --standard=ModernWpcsRuleset tests/fixtures/Dirty.php)"
          set -e
          echo "$output"
          for code in \
            ModernWpcsStandard.StrictTypes.RequireStrictTypes.StrictTypes \
            ImportDetection.Imports.RequireImports.Symbol \
            WordPress.PHP.StrictInArray.MissingTrueStrict \
            VariableAnalysis.CodeAnalysis.VariableAnalysis.UndefinedVariable
          do
            if ! grep -qF "($code)" <<< "$output"; then
              echo "::error::Expected sniff code not reported: $code"
              exit 1
            fi
          done
